<svg viewBox="0 0 480 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Road surface -->
  <rect x="0" y="160" width="480" height="40" fill="#e2e8f0" rx="2"/>
  <rect x="0" y="158" width="480" height="4" fill="#cbd5e1"/>
  <!-- Road dashes -->
  <rect x="40" y="176" width="40" height="4" fill="white" rx="2"/>
  <rect x="120" y="176" width="40" height="4" fill="white" rx="2"/>
  <rect x="200" y="176" width="40" height="4" fill="white" rx="2"/>
  <rect x="280" y="176" width="40" height="4" fill="white" rx="2"/>
  <rect x="360" y="176" width="40" height="4" fill="white" rx="2"/>

  <!-- Car body - hybrid (Toyota Prius silhouette style) -->
  <path d="M60 160 L80 100 Q100 72 150 68 L310 68 Q370 68 400 90 L420 130 L430 160 Z" fill="#16a34a"/>
  <!-- Body highlight -->
  <path d="M80 100 Q100 80 150 76 L310 76 Q365 76 395 96 L380 86 Q350 72 310 72 L150 72 Q102 72 84 98 Z" fill="#22c55e" opacity="0.6"/>

  <!-- Windows -->
  <path d="M155 76 L185 82 L190 110 L145 110 Z" fill="#bbf7d0" opacity="0.85"/>
  <path d="M195 82 L250 80 L252 110 L192 110 Z" fill="#bbf7d0" opacity="0.85"/>
  <path d="M260 80 L315 82 L316 110 L258 110 Z" fill="#bbf7d0" opacity="0.85"/>
  <path d="M322 82 L360 86 L358 110 L320 110 Z" fill="#bbf7d0" opacity="0.7"/>

  <!-- Window dividers (A,B,C pillars) -->
  <rect x="187" y="78" width="6" height="32" fill="#15803d" rx="1"/>
  <rect x="253" y="78" width="6" height="32" fill="#15803d" rx="1"/>
  <rect x="317" y="80" width="6" height="30" fill="#15803d" rx="1"/>

  <!-- Roof rack -->
  <rect x="175" y="67" width="130" height="5" fill="#14532d" rx="2"/>

  <!-- Front bumper -->
  <path d="M430 140 L445 148 L445 162 L430 162 Z" fill="#166534"/>
  <!-- Headlights -->
  <path d="M433 144 L444 150 L444 158 L433 158 Z" fill="#dcfce7" opacity="0.9"/>
  <!-- DRL strip -->
  <rect x="430" y="144" width="14" height="3" fill="#4ade80" rx="1"/>

  <!-- Rear end -->
  <path d="M60 140 L45 148 L45 162 L60 162 Z" fill="#166534"/>
  <!-- Tail lights -->
  <rect x="45" y="146" width="14" height="12" fill="#86efac" rx="2" opacity="0.8"/>

  <!-- Rear door handle -->
  <rect x="120" y="128" width="18" height="5" fill="#14532d" rx="2"/>
  <!-- Front door handle -->
  <rect x="320" y="128" width="18" height="5" fill="#14532d" rx="2"/>

  <!-- Side sill / trim line -->
  <path d="M80 150 L430 150" stroke="#14532d" strokeWidth="2.5" strokeLinecap="round"/>

  <!-- Front wheel -->
  <circle cx="370" cy="162" r="28" fill="#1e293b"/>
  <circle cx="370" cy="162" r="20" fill="#334155"/>
  <circle cx="370" cy="162" r="11" fill="#475569"/>
  <circle cx="370" cy="162" r="5" fill="#94a3b8"/>
  <!-- Wheel spokes -->
  <line x1="370" y1="142" x2="370" y2="152" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="370" y1="172" x2="370" y2="182" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="350" y1="162" x2="360" y2="162" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="380" y1="162" x2="390" y2="162" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="356" y1="148" x2="363" y2="155" stroke="#94a3b8" strokeWidth="2"/>
  <line x1="377" y1="169" x2="384" y2="176" stroke="#94a3b8" strokeWidth="2"/>
  <line x1="356" y1="176" x2="363" y2="169" stroke="#94a3b8" strokeWidth="2"/>
  <line x1="377" y1="155" x2="384" y2="148" stroke="#94a3b8" strokeWidth="2"/>

  <!-- Rear wheel -->
  <circle cx="120" cy="162" r="28" fill="#1e293b"/>
  <circle cx="120" cy="162" r="20" fill="#334155"/>
  <circle cx="120" cy="162" r="11" fill="#475569"/>
  <circle cx="120" cy="162" r="5" fill="#94a3b8"/>
  <!-- Wheel spokes -->
  <line x1="120" y1="142" x2="120" y2="152" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="120" y1="172" x2="120" y2="182" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="100" y1="162" x2="110" y2="162" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="130" y1="162" x2="140" y2="162" stroke="#94a3b8" strokeWidth="2.5"/>
  <line x1="106" y1="148" x2="113" y2="155" stroke="#94a3b8" strokeWidth="2"/>
  <line x1="127" y1="169" x2="134" y2="176" stroke="#94a3b8" strokeWidth="2"/>
  <line x1="106" y1="176" x2="113" y2="169" stroke="#94a3b8" strokeWidth="2"/>
  <line x1="127" y1="155" x2="134" y2="148" stroke="#94a3b8" strokeWidth="2"/>

  <!-- HV badge -->
  <rect x="190" y="148" width="36" height="14" fill="#14532d" rx="3"/>
  <text x="208" y="158" fontFamily="Arial" fontWeight="bold" fontSize="8" fill="#4ade80" textAnchor="middle">HV</text>

  <!-- Hybrid badge -->
  <rect x="240" y="148" width="52" height="14" fill="#16a34a" rx="3"/>
  <text x="266" y="158" fontFamily="Arial" fontWeight="bold" fontSize="7.5" fill="white" textAnchor="middle">HYBRID</text>

  <!-- Green glow under car -->
  <ellipse cx="245" cy="165" rx="180" ry="8" fill="#22c55e" opacity="0.12"/>

  <!-- Charging port lid (closed) -->
  <rect x="420" y="118" width="10" height="14" fill="#166534" rx="2"/>
  <rect x="421" y="119" width="8" height="12" fill="#14532d" rx="1.5"/>
  <circle cx="425" cy="125" r="2" fill="#4ade80" opacity="0.7"/>
</svg>
